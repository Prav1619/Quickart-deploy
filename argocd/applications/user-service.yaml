apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-service
  namespace: argocd
  annotations:
      argocd-image-updater.argoproj.io/image-list: user=prav1619/user-service
      argocd-image-updater.argoproj.io/user.update-strategy: newest-build
      argocd-image-updater.argoproj.io/user.tag-pattern: "^[0-9a-f]{7}$"
      argocd-image-updater.argoproj.io/user.write-back-method: git
      argocd-image-updater.argoproj.io/git-branch: main
      argocd-image-updater.argoproj.io/user.helm.image-name: image.repository
      argocd-image-updater.argoproj.io/user.helm.image-tag: image.tag  
spec:
  project: default

  source:
    repoURL: https://github.com/Prav1619/Quickart-deploy
    targetRevision: main
    path: charts/user-service

    helm:
      valueFiles:
        - ../../environments/dev/user-service.yaml   # 👈 CRITICAL

  destination:
    server: https://kubernetes.default.svc
    namespace: quickart

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
