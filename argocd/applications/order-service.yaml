apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-service
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: order=prav1619/order-service
    argocd-image-updater.argoproj.io/order.update-strategy: newest-build
    argocd-image-updater.argoproj.io/order.tag-pattern: "^[0-9a-f]{7}$"
    argocd-image-updater.argoproj.io/order.write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/order.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/order.helm.image-tag: image.tag

spec:
  project: default

  source:
    repoURL: https://github.com/Prav1619/Quickart-deploy
    targetRevision: main
    path: charts/quickart
    helm:
      valueFiles:
        - environments/dev/order-service.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: quickart

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
